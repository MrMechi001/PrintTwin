<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrintTwin</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<section id="hud" aria-live="polite">
  <header>
    <span id="state" class="chip">…</span>
    <span id="pname">PrintTwin</span>
  </header>
  <div id="file" class="file">Connecting…</div>
  <div class="bar"><div id="bar"></div></div>
  <div class="row big">
    <span id="pct">–</span>
    <span id="eta" class="muted">–</span>
  </div>
  <div class="row">
    <span id="layer">Layer –</span>
    <span id="z" class="muted">Z –</span>
  </div>
  <div class="row temps">
    <span>Nozzle <b id="tn">–</b></span>
    <span>Bed <b id="tb">–</b></span>
  </div>
  <div class="row live"><span id="live" class="dot"></span><span id="livetxt">No live data</span></div>
  <div id="model" hidden></div>
  <div id="loading" hidden></div>
</section>

<section id="legend" hidden></section>

<nav id="tools">
  <button id="bColor" type="button" aria-pressed="false" title="Colour by feature type or filament colour">Features</button>
  <button id="bGhost" type="button" aria-pressed="true" title="Show what is still to be printed">Preview</button>
  <button id="bFollow" type="button" aria-pressed="false" title="Camera follows the nozzle">Follow</button>
  <button id="bFit" type="button" title="Frame the view">Fit</button>
  <button id="bLapse" type="button" aria-pressed="false" aria-controls="lapse" title="Timelapse: replay the print or circle the live print">Timelapse</button>
  <button id="bPrinter" type="button" aria-pressed="false" title="Show the whole printer: moving bed, gantry and extruder">Printer</button>
  <button id="bCtl" type="button" aria-pressed="false" aria-controls="ctl" title="Control the printer: pause, stop, print again, upload" hidden>Control</button>
  <button id="bPhone" type="button" title="Open this view on your phone">Phone</button>
</nav>

<section id="ctl" hidden aria-labelledby="ctlTitle">
  <h2 id="ctlTitle">Printer control</h2>
  <form id="ctlLock" hidden>
    <label class="opt">Password <input id="ctlPw" type="password" autocomplete="current-password"></label>
    <button type="submit">Unlock</button>
  </form>
  <div id="ctlMain" hidden>
    <div class="btns">
      <button id="ctlPause" type="button">Pause</button>
      <button id="ctlResume" type="button">Resume</button>
      <button id="ctlStop" type="button" class="danger">Stop</button>
    </div>
    <h3>Print again <button id="ctlReload" type="button" class="link" title="Read the printer's files again">↻</button></h3>
    <ul id="ctlFiles"><li class="muted">…</li></ul>
    <h3>Upload</h3>
    <input id="ctlFile" type="file" accept=".bgcode,.gcode,.gco,.g">
    <label class="chk"><input type="checkbox" id="ctlStart" checked> Print it right away</label>
    <button id="ctlSend" type="button" disabled>Upload</button>
  </div>
  <div id="ctlStatus" class="muted" role="status"></div>
</section>

<section id="lapse" hidden aria-labelledby="lapseTitle">
  <h2 id="lapseTitle">Timelapse</h2>
  <div class="seg" role="radiogroup" aria-label="What to show">
    <label title="The print grows from the first layer in a few seconds"><input type="radio" name="lpMode" value="replay" checked><span>Replay</span></label>
    <label title="The live print, for screen recordings"><input type="radio" name="lpMode" value="live"><span>Live</span></label>
  </div>
  <div class="seg" role="radiogroup" aria-label="Camera">
    <label title="The camera circles the build plate (the printer in the Printer view)"><input type="radio" name="lpCam" value="orbit" checked><span>Orbit</span></label>
    <label title="The camera stays where it is"><input type="radio" name="lpCam" value="fixed"><span>Fixed</span></label>
  </div>
  <label class="opt" data-for="replay">Length
    <select id="lpLen"><option value="15">15 s</option><option value="30">30 s</option><option value="60">1 min</option><option value="120">2 min</option></select></label>
  <label class="opt" data-for="replay" id="lpRangeRow">Up to
    <select id="lpRange"><option value="now">now</option><option value="all">the end of the print</option></select></label>
  <label class="opt" data-for="orbit-live">One turn in
    <select id="lpTurn"><option value="60">1 min</option><option value="300">5 min</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>
  <label class="chk" data-for="replay" title="Start asks where to save it (Chrome, Edge, the slicer); other browsers save it to your downloads"><input type="checkbox" id="lpRec"> Save as video</label>
  <label class="chk"><input type="checkbox" id="lpClean"> Hide the panels</label>
  <div class="go"><span id="lpStatus" class="muted"></span><button id="lpGo" type="button">Start</button></div>
</section>
<button id="lpStop" type="button" hidden>■ Stop timelapse</button>

<dialog id="phone" aria-labelledby="phoneTitle">
  <h2 id="phoneTitle">Open on your phone</h2>
  <p class="muted">Phone on the same Wi-Fi: scan the code with the camera.</p>
  <div id="qr"></div>
  <ul id="urls"></ul>
  <button id="phoneClose" type="button">Close</button>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
