name: tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Toolpath parser
        run: python -I tests/test_toolpath.py
      - name: Printer model detection
        run: python -I tests/test_models.py
      - name: Printer 3D models (GLB structure)
        run: python -I tests/test_glb_models.py
      - name: Bridge end-to-end (simulated printer)
        run: python -I tests/test_bridge.py
      - name: MK3 / MK3S+ with PrusaLink on a Raspberry Pi (simulated) + MK4 live metrics
        run: python -I tests/test_mk3.py
      - name: Slicer print host
        run: python -I tests/test_slicerhost.py
      - name: Klipper / Moonraker end-to-end (simulated printer)
        run: python -I tests/test_moonraker.py
      - name: MQTT client (for Bambu Lab printers)
        run: python -I tests/test_mqtt.py
      - name: Bambu Lab end-to-end (simulated printer)
        run: python -I tests/test_bambu.py
      - name: Bambu Lab job logic (offline)
        run: python -I tests/test_bambu_adapter.py
