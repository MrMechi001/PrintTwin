# Copy to config.local.toml and fill in. config.local.toml is git-ignored.
# One [[printer]] block per printer.

[[printer]]
id = "mk4"                      # short id, used in URLs: /?p=mk4
name = "Prusa MK4"
kind = "prusalink"              # Prusa MK4/MK4S/MK3.9/Core One/XL/MINI with PrusaLink, MK3/MK3S/MK3S+
                                # with PrusaLink on a Raspberry Pi
host = "192.168.x.y"            # printer IP (also used to match its UDP metrics); MK3: the Pi's
                                # address, e.g. "192.168.x.y:8080" or "prusalink.local:8080"
api_key = "PRUSALINK-API-KEY"   # printer: Settings > Network > PrusaLink (MK3: PrusaLink's web page,
                                # Settings > API key)
# user = "..."                  # MK3 with PrusaLink on a Pi and no API key: the user name and
# password = "..."              # password from PrusaLink's setup (HTTP digest login)
# model = "auto"                # 3D model in the Printer view: auto (detect), mk4, mk4s, mk39,
                                # mk39s, coreone, coreonel, xl, mini, mk3s, mk3, bedslinger, corexy

# A Klipper printer (Voron & co.) through Moonraker - Mainsail / Fluidd address or host:7125:
# [[printer]]
# id = "voron"
# name = "Voron 2.4"
# kind = "moonraker"
# host = "voron.local"
# api_key = ""                  # only if Moonraker asks for one

# A Bambu Lab printer (read-only): the serial number and the LAN access code from the printer's screen
# [[printer]]
# id = "p1s"
# name = "Bambu Lab P1S"
# kind = "bambu"
# host = "192.168.x.y"
# serial = "01P00A..."
# access_code = "12345678"
# cafile = "..."                # optional: a CA file of your own (Bambu's CAs come with PrintTwin)

[server]
listen_host = "0.0.0.0"         # 0.0.0.0 = reachable from other devices on the LAN/Tailscale
port = 8790

[metrics]
# Printer side: Settings > Network > Metrics & Log
#   host = this PC's IP, port = listen_port, enable pos_x / pos_y / pos_z in the Metrics List
listen_host = "0.0.0.0"
listen_port = 8514

[slicer]
# PrintTwin as the print host in PrusaSlicer (Physical Printer) / OrcaSlicer (Device tab):
# the slicer's printer tab shows the live 3D view, uploads pass through PrintTwin to the printer
# and the model is ready the moment the print starts. In the slicer: host type PrusaLink,
# hostname http://<this PC's IP>:8790/p/<printer id>, API key = the printer's PrusaLink key.
# PrintTwin passes each call on unchanged with the slicer's key; it adds no credentials itself.
print_host = false
